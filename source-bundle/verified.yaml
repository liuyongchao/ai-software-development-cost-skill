  title: 系统与软件工程 人工智能应用软件开发成本度量（2026-08-18征求意见稿）
  author: 中国计算机用户协会、北京软件造价评估技术创新联盟提出并归口；起草人未列
  source_pack: ai-software-development-cost-draft
  baseline_tag: draft-20260818
entry:
  name: ai-software-development-cost-draft
  description: 用于AI应用软件开发成本测算与复核（AI software development cost）：核范围、费用归类、数据工时、模型/智能体数量、任务工时、岗位费率、采购租赁及外部服务和汇总。依据2026-08-18征求意见稿，参数须有明确来源。不用于预训练、运维、硬件研发或RAG技术实现；完整功能点计数与统计校准需外部方法。
  core_principles:
  - 这是2026-08-18团体标准征求意见稿的限定方法技能；保留草稿和资料性参数身份，不断言现行正式效力。
  - 先判开发启动至交付范围，再按三类综合人力及六类直接非人力分解，按承担方、成果和期间排重。
  - 计算参数、岗位、费率、单位及转换依据明确；缺输入输出待补，不默认中值、1或0。计算器不验证来源真实性。
  - 模型式5为选定假设方程的情景计算；附录冲突不自动择一，已含全局因素不得再乘；外包已扣不重复扣。
  - 参考参数、案例和14组问题见overview；项目未知成本与确认不发生的零分开，区间不冒充统计置信区间。
  - 完整估算按任务分阶段读取能力卡，每个子任务最多读取两张，保存台账再转下一步，最终由汇总卡收口。
  out_of_scope:
  - 基础模型从零预训练、人工智能基础研究、硬件研发和交付后运行维护估价。
  - 如何编写RAG代码、部署模型或训练算法的技术实施。
  - 仅凭本稿完整计数功能点、自动拟合校准或宣称符合外部报告标准。
  stop_conditions:
  - 关键单位、参数或范围缺失时停止受影响项数值输出，保留已知部分和待补证据。
  - 遇7.3.3分类、0.25/0.26、TF6范围或不唯一档位，标明问题并要求采用依据；不能静默修正原稿。
  - 缺失费用不得填零，历史/附录费率不当成当前默认价格。
  - 附带脚本先阅读说明；它只处理显式输入，现实来源与适用性由任务证据确认。
